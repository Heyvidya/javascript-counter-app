<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        h1{
            width:100%;
            
            color: rgb(4, 4, 122);
            margin-bottom:0px;
            
        }

        p{
            color:rgb(4, 4, 122) ;
            font-size:50px;
            margin-top: 0px;
            margin-bottom:0px;
        }

        button{
            margin-top:0px;
            width:75px;
            height:30px;
            margin-left:5px;
            border-width: 2px;
            border-style: solid;
            border-radius: 8px;
        }

        .counter-container{
            width:100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="counter-container">
        <h1>Counter</h1>
        <p id="count">0</p>
        <button onclick="Decrease()">Decrease</button>
        <button onclick="Reset()">Reset</button>
        <button onclick="Increase()">Increase</button>
    </div>

    <script>

        let count=0;

        
        function Increase(){
            count=count+1;
            document.getElementById("count").textContent=count;

            }


        function Decrease(){
            count=count-1;
            document.getElementById("count").textContent=count;

            }


        function Reset(){
            count=0;
            document.getElementById("count").textContent=count;

            }

   
    </script>
    
</body>
</html>
