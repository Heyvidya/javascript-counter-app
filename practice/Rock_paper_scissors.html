
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e8ff;
        }

        h1 {
            color: white;
        }

        p {
            color: white;
            font-size: 20px;
        }

        .main {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            border: 2px solid black;
            background: linear-gradient(to right, violet, blue);
            padding: 20px 10px;
        }

        button {
            width: 90px;
            height: 50px;
            margin: 5px;
            color: rgb(0, 42, 255);
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            
        }

    
        .info {
            font-size: 35px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <div class="main">
        <h1>✊✋✌️ Rock Paper Scissors</h1>

        <button onclick="playGame('rock')">✊ Rock</button>
        <button onclick="playGame('paper')">✋ Paper</button>
        <button onclick="playGame('scissors')">✌️ Scissors</button>

        <p id="player-choice">You chose: -</p>
        <p id="computer-choice">Computer chose: -</p>

        <p id="result" class="info">Make your move!</p>

        <p id="playerScore">Player: 0</p>
        <p id="computerScore">Computer: 0</p>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;

        function playGame(playerChoice) {
            const choices = ["rock", "paper", "scissors"];

            const randomIndex = Math.floor(Math.random() * 3);
            const computerChoice = choices[randomIndex];

            let result;

            if (playerChoice === computerChoice) {
                result = "It's a tie!";
            } else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {
                result = "You win!";
                playerScore++;
            } else {
                result = "Computer wins!";
                computerScore++;
            }

            document.getElementById("player-choice").textContent =
                "You chose: " + playerChoice;

            document.getElementById("computer-choice").textContent =
                "Computer chose: " + computerChoice;

            document.getElementById("result").textContent = result;

            document.getElementById("playerScore").textContent =
                "Player: " + playerScore;

            document.getElementById("computerScore").textContent =
                "Computer: " + computerScore;
        }
    </script>

</body>
</html>
