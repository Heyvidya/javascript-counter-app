<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            padding-bottom:15px;
            padding-top:15px;
            padding-left:25px;
            padding-right:25px;
            font-size:9px;
            border-radius: 5px ;
            border: none;
            margin-left:8px;
            color: white;
            }

            button:hover{
                border:2px solid black;
            }

        

        

          

        
    </style>
</head>
<body>
    <div class="final">
        <h1>Interchangeable Background Color</h1>
        <button style="background-color:rgb(171, 2, 171) ; " onclick="change_color('purple')">PURPLE</button>
        <button style="background-color: rgb(40, 144, 249);"onclick="change_color('blue')">BLUE</button>
        <button style="background-color: rgb(255, 32, 32);"onclick="change_color('red')">RED</button>
        <button style="background-color: rgb(4, 185, 4);"onclick="change_color('green')">GREEN</button>
        <button style="background-color: rgb(255, 225, 0); color: black;"onclick="change_color('yellow')">YELLOW</button>
        <button style="background-color: teal;"onclick="change_color('teal')">TEAL</button>
    </div>

    <script>
        function change_color(color){
            document.body.style.backgroundColor = color;
            
            
        }
    </script>
    
</body>
</html>
